[project]
name = "department-workbench"
version = "0.0.1"
description = "部门市场-研发协同工作台"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "dj-database-url>=2.3,<4",
  "python-dotenv>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<26",
  "whitenoise>=6.9,<8",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-django>=4.10,<5",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
